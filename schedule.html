<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>البرنامج الأسبوعي | مدرستي</title>

  <script src="libs/tailwind.js"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { cairo: ['Cairo', 'sans-serif'] } } } };
  </script>

  <link href="libs/aos.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />

  <style>
    /* أنماط خاصة بصفحة الجدول */
    .schedule-page-cell {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 18px;
      padding: 18px;
      transition: all 0.35s ease;
      position: relative;
      overflow: hidden;
    }
    .schedule-page-cell:hover {
      border-color: rgba(251, 191, 36, 0.4);
      background: rgba(251, 191, 36, 0.05);
      transform: translateY(-3px);
      box-shadow: 0 20px 50px rgba(251, 191, 36, 0.15);
    }
    .schedule-page-cell.is-today {
      border-color: rgba(251, 191, 36, 0.55);
      background: linear-gradient(135deg, rgba(251, 191, 36, 0.12) 0%, rgba(251, 191, 36, 0.02) 100%);
      box-shadow: 0 0 35px rgba(251, 191, 36, 0.2), inset 0 0 25px rgba(251, 191, 36, 0.06);
    }
    .schedule-page-cell.is-today::before {
      content: 'اليوم';
      position: absolute;
      top: 12px;
      inset-inline-end: 12px;
      padding: 3px 10px;
      border-radius: 999px;
      background: #fbbf24;
      color: #1c1917;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.05em;
      box-shadow: 0 0 15px rgba(251, 191, 36, 0.6);
    }
    .sched-day-title {
      font-size: 18px;
      font-weight: 900;
      color: #fcd34d;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px dashed rgba(251, 191, 36, 0.2);
      text-align: center;
      letter-spacing: 0.05em;
    }
    .sched-slot {
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 10px;
    }
    .sched-slot.practical {
      background: linear-gradient(135deg, rgba(251, 191, 36, 0.15) 0%, rgba(217, 119, 6, 0.05) 100%);
      border: 1px solid rgba(251, 191, 36, 0.35);
    }
    .sched-slot.theory {
      background: rgba(120, 113, 108, 0.08);
      border: 1px solid rgba(120, 113, 108, 0.18);
    }
    .sched-slot-label {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.15em;
      margin-bottom: 6px;
      opacity: 0.7;
    }
    .sched-slot-value {
      font-size: 15px;
      font-weight: 900;
    }
    .sched-slot.practical .sched-slot-label { color: #fcd34d; }
    .sched-slot.practical .sched-slot-value { color: #fef3c7; }
    .sched-slot.theory .sched-slot-label { color: #a8a29e; }
    .sched-slot.theory .sched-slot-value { color: #78716c; }

    /* زر الطباعة */
    .print-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 18px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 800;
      color: #1c1917;
      background: linear-gradient(135deg, #fcd34d, #fbbf24);
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(251, 191, 36, 0.35);
      transition: all 0.3s ease;
      font-family: 'Cairo', sans-serif;
    }
    .print-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 35px rgba(251, 191, 36, 0.5);
    }
    .print-btn svg { width: 16px; height: 16px; }

    @media print {
      #sidebar, #bottom-nav, header, .print-btn, #three-bg, .glow-orb { display: none !important; }
      body { background: white !important; color: black !important; }
      #main-content { margin: 0 !important; }
      .schedule-page-cell { background: white !important; border: 1px solid #ddd !important; }
    }
  </style>
</head>

<body class="font-cairo overflow-x-hidden">

  <!-- 3D -->
  <div id="three-bg"></div>
  <div class="glow-orb o1"></div>
  <div class="glow-orb o2"></div>

  <!-- SIDEBAR MOUNT -->
  <div id="sidebar-mount"></div>

  <!-- Main -->
  <main id="main-content">

    <!-- HEADER MOUNT -->
    <div id="header-mount"></div>

    <div class="px-4 sm:px-6 lg:px-8 py-6 sm:py-8 space-y-6">

      <!-- Page Header -->
      <section id="hero" class="flex items-start justify-between flex-wrap gap-4">
        <div>
          <h1 class="text-3xl sm:text-4xl lg:text-5xl font-black leading-tight">
            <span class="bg-gradient-to-l from-amber-300 via-yellow-200 to-amber-400 bg-clip-text text-transparent" data-i18n="pageScheduleTitle">البرنامج الأسبوعي</span>
          </h1>
          <p class="mt-2 text-stone-400 text-sm sm:text-base" data-i18n="pageScheduleSub">جدول حصص فئتك خلال الأسبوع</p>
          <p class="text-xs text-amber-200/60 mt-2 font-bold" data-weekly-sub>—</p>
        </div>

        <button class="print-btn" id="print-btn" type="button">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
          </svg>
          <span data-i18n="print">طباعة</span>
        </button>
      </section>

      <!-- Legend -->
      <section class="flex items-center gap-4 text-xs flex-wrap">
        <div class="flex items-center gap-2">
          <span class="w-3 h-3 rounded-full bg-amber-400 shadow-lg shadow-amber-400/50"></span>
          <span class="text-stone-400 font-bold" data-i18n="legendPractical">عملي</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="w-3 h-3 rounded-full bg-stone-600"></span>
          <span class="text-stone-400 font-bold" data-i18n="legendTheory">نظري</span>
        </div>
      </section>

      <!-- Week Grid -->
      <section id="week-grid-full" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-4"></section>

    </div>
  </main>

  <!-- BOTTOM NAV MOUNT -->
  <div id="bottom-nav-mount"></div>

  <!-- Scripts -->
  <script src="libs/sweetalert2.min.js" defer></script>
  <script src="libs/gsap.min.js" defer></script>
  <script src="libs/three.min.js" defer></script>
  <script src="libs/aos.js" defer></script>
  <script src="js/sound-manager.js" defer></script>
  <script src="js/three-scene.js" defer></script>
  <script src="js/app.js" defer></script>
  <script src="js/schedule.js" defer></script>
</body>
</html>
