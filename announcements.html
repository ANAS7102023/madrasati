  <style>
    .announce-card {
      position: relative;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 20px;
      padding: 22px 24px;
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      overflow: hidden;
      display: flex;
      gap: 18px;
    }
    .announce-card::before {
      content: '';
      position: absolute;
      inset-inline-start: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      border-radius: 20px 0 0 20px;
    }
    .announce-card[data-color="amber"]::before   { background: linear-gradient(to bottom, #fcd34d, #f59e0b); }
    .announce-card[data-color="blue"]::before    { background: linear-gradient(to bottom, #60a5fa, #3b82f6); }
    .announce-card[data-color="emerald"]::before { background: linear-gradient(to bottom, #34d399, #10b981); }
    .announce-card[data-color="rose"]::before    { background: linear-gradient(to bottom, #fb7185, #f43f5e); }
    .announce-card[data-color="purple"]::before  { background: linear-gradient(to bottom, #c084fc, #a855f7); }
    .announce-card[data-color="cyan"]::before    { background: linear-gradient(to bottom, #22d3ee, #06b6d4); }
    .announce-card[data-color="indigo"]::before  { background: linear-gradient(to bottom, #818cf8, #6366f1); }
    .announce-card[data-color="slate"]::before   { background: linear-gradient(to bottom, #94a3b8, #64748b); }

    .announce-card:hover {
      border-color: rgba(251, 191, 36, 0.25);
      background: rgba(251, 191, 36, 0.03);
      transform: translateY(-3px);
      box-shadow: 0 20px 50px rgba(251, 191, 36, 0.12);
    }

    .announce-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .announce-icon[data-color="amber"]   { background: rgba(251, 191, 36, 0.15); color: #fcd34d; }
    .announce-icon[data-color="blue"]    { background: rgba(96, 165, 250, 0.15); color: #60a5fa; }
    .announce-icon[data-color="emerald"] { background: rgba(52, 211, 153, 0.15); color: #34d399; }
    .announce-icon[data-color="rose"]    { background: rgba(251, 113, 133, 0.15); color: #fb7185; }
    .announce-icon[data-color="purple"]  { background: rgba(192, 132, 252, 0.15); color: #c084fc; }
    .announce-icon[data-color="cyan"]    { background: rgba(34, 211, 238, 0.15); color: #22d3ee; }
    .announce-icon[data-color="indigo"]  { background: rgba(129, 140, 248, 0.15); color: #818cf8; }
    .announce-icon[data-color="slate"]   { background: rgba(148, 163, 184, 0.15); color: #94a3b8; }
    .announce-icon svg { width: 22px; height: 22px; }

    .announce-date {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 800;
      color: #78716c;
      margin-bottom: 8px;
      letter-spacing: 0.05em;
    }
    .announce-date svg { width: 12px; height: 12px; }

    .announce-title {
      font-size: 16px;
      font-weight: 900;
      color: #ffffff;
      margin-bottom: 8px;
      line-height: 1.4;
    }
    .announce-body {
      font-size: 13px;
      color: #a8a29e;
      font-weight: 600;
      line-height: 1.8;
    }
    .announce-tag {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
      margin-top: 12px;
    }
    .announce-tag[data-color="amber"]   { background: rgba(251, 191, 36, 0.12); color: #fcd34d; border: 1px solid rgba(251, 191, 36, 0.3); }
    .announce-tag[data-color="blue"]    { background: rgba(96, 165, 250, 0.12); color: #60a5fa; border: 1px solid rgba(96, 165, 250, 0.3); }
    .announce-tag[data-color="emerald"] { background: rgba(52, 211, 153, 0.12); color: #34d399; border: 1px solid rgba(52, 211, 153, 0.3); }
    .announce-tag[data-color="rose"]    { background: rgba(251, 113, 133, 0.12); color: #fb7185; border: 1px solid rgba(251, 113, 133, 0.3); }
    .announce-tag[data-color="purple"]  { background: rgba(192, 132, 252, 0.12); color: #c084fc; border: 1px solid rgba(192, 132, 252, 0.3); }
    .announce-tag[data-color="cyan"]    { background: rgba(34, 211, 238, 0.12); color: #22d3ee; border: 1px solid rgba(34, 211, 238, 0.3); }
    .announce-tag[data-color="indigo"]  { background: rgba(129, 140, 248, 0.12); color: #818cf8; border: 1px solid rgba(129, 140, 248, 0.3); }
    .announce-tag[data-color="slate"]   { background: rgba(148, 163, 184, 0.12); color: #94a3b8; border: 1px solid rgba(148, 163, 184, 0.3); }

    /* ===== الإعلان المميز ===== */
    .announce-featured {
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.14) 0%, rgba(59, 130, 246, 0.06) 100%);
      border: 1.5px solid rgba(192, 132, 252, 0.4);
      box-shadow: 0 20px 60px rgba(168, 85, 247, 0.2);
      position: relative;
      overflow: hidden;
    }
    .announce-featured::after {
      content: '';
      position: absolute;
      top: -100px;
      inset-inline-end: -100px;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(192, 132, 252, 0.35) 0%, transparent 70%);
      filter: blur(60px);
      pointer-events: none;
      animation: featured-glow 4s ease-in-out infinite;
    }
    @keyframes featured-glow {
      0%, 100% { opacity: 0.6; }
      50%      { opacity: 1; }
    }
    .announce-featured .announce-title { font-size: 18px; }

    .featured-badge {
      position: absolute;
      top: 16px;
      inset-inline-end: 16px;
      padding: 4px 12px;
      border-radius: 999px;
      background: linear-gradient(135deg, #c084fc, #a855f7);
      color: #ffffff;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.1em;
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.5);
      z-index: 3;
      animation: badge-pulse 2s ease-in-out infinite;
    }
    @keyframes badge-pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 4px 15px rgba(168, 85, 247, 0.5); }
      50%      { transform: scale(1.06); box-shadow: 0 6px 20px rgba(168, 85, 247, 0.7); }
    }

    .dev-names {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
      position: relative;
      z-index: 2;
    }
    .dev-name {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(192, 132, 252, 0.18) 0%, rgba(168, 85, 247, 0.08) 100%);
      border: 1px solid rgba(192, 132, 252, 0.4);
      color: #e9d5ff;
      font-size: 13px;
      font-weight: 800;
      transition: all 0.3s ease;
    }
    .dev-name:hover {
      transform: translateY(-2px) scale(1.04);
      background: linear-gradient(135deg, rgba(192, 132, 252, 0.3) 0%, rgba(168, 85, 247, 0.15) 100%);
      box-shadow: 0 8px 25px rgba(168, 85, 247, 0.35);
      color: #ffffff;
    }
    .dev-name .dev-avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: linear-gradient(135deg, #c084fc, #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 900;
      color: #ffffff;
    }
    .dev-name .dev-role {
      font-size: 10px;
      color: rgba(233, 213, 255, 0.65);
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .project-progress {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px dashed rgba(192, 132, 252, 0.25);
      position: relative;
      z-index: 2;
    }
    .project-progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 800;
      color: rgba(233, 213, 255, 0.85);
      margin-bottom: 8px;
      letter-spacing: 0.05em;
    }
    .project-progress-bar {
      height: 8px;
      border-radius: 999px;
      background: rgba(30, 20, 60, 0.6);
      overflow: hidden;
      position: relative;
    }
    .project-progress-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(to left, #c084fc, #a855f7, #60a5fa, #c084fc);
      background-size: 200% 100%;
      box-shadow: 0 0 15px rgba(192, 132, 252, 0.6);
      animation: progress-shimmer 2.5s linear infinite;
      width: 0%;
    }
    @keyframes progress-shimmer {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }
  </style>
</head>

  <script defer>

      const App = window.App;

      const developers = [

      function render() {
        const list = document.getElementById('announcements-list');
        const lang = App.getCurrentLang();
        const isAr = lang === 'ar';

        list.innerHTML = announcements.map((a) => {
          const date  = isAr ? a.date_ar  : a.date_en;
          const title = isAr ? a.title_ar : a.title_en;
          const body  = isAr ? a.body_ar  : a.body_en;
          const tag   = isAr ? a.tag_ar   : a.tag_en;

          if (a.type === 'featured') {
            const badge = isAr ? a.featured_badge_ar : a.featured_badge_en;
            const devsHTML = a.developers.map(d => {
              const name = isAr ? d.name_ar : d.name_en;
              const role = isAr ? d.role_ar : d.role_en;
              return `
                <span class="dev-name">
                  <span class="dev-avatar">${name.charAt(0)}</span>
                  <span>${name}</span>
                  <span class="dev-role">${role}</span>
                </span>
              `;
            }).join('');

            return `
              <div class="announce-card announce-featured" data-color="${a.color}">
                <span class="featured-badge">${badge}</span>
                <div class="announce-icon" data-color="${a.color}">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    ${icons[a.icon]}
                  </svg>
                </div>
                <div class="flex-1 min-w-0">
                  <div class="announce-date">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    ${date}
                  </div>
                  <div class="announce-title">${title}</div>
                  <div class="announce-body">${body}</div>
                  <div class="dev-names">${devsHTML}</div>
                  <div class="project-progress">
                    <div class="project-progress-label">
                      <span>${isAr ? 'نسبة الإنجاز' : 'Progress'}</span>
                      <span>${a.progress}%</span>
                    </div>
                    <div class="project-progress-bar">
                      <div class="project-progress-fill" data-progress="${a.progress}"></div>
                    </div>
                  </div>
                  <span class="announce-tag" data-color="${a.color}" style="margin-top: 16px;">${tag}</span>
                </div>
              </div>
            `;
          }

          return `
            <div class="announce-card" data-color="${a.color}">
              <div class="announce-icon" data-color="${a.color}">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  ${icons[a.icon]}
                </svg>
              </div>
              <div class="flex-1 min-w-0">
                <div class="announce-date">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                  </svg>
                  ${date}
                </div>
                <div class="announce-title">${title}</div>
                <div class="announce-body">${body}</div>
                <span class="announce-tag" data-color="${a.color}">${tag}</span>
              </div>
            </div>
          `;
        }).join('');

        // ===== حركات GSAP =====
        if (window.gsap) {
          // 1. الحالة الأولية
          gsap.set('.announce-card', { opacity: 0, y: 40, scale: 0.96 });

          // 2. الظهور بحركة
          gsap.to('.announce-card', {
            opacity: 1, y: 0, scale: 1,
            duration: 0.6,
            stagger: 0.1,
            ease: 'power3.out',
            onComplete: () => {
              // 3. مسح الـ inline styles → العنصر يعود طبيعياً (مرئي دائماً)
              document.querySelectorAll('.announce-card').forEach(el => {
                el.style.opacity = '';
                el.style.transform = '';
              });
            }
          });

          // شريط التقدم
          document.querySelectorAll('.project-progress-fill').forEach(el => {
            const target = parseInt(el.dataset.progress) || 0;
            gsap.fromTo(el,
              { width: '0%' },
              { width: target + '%', duration: 1.8, delay: 0.8, ease: 'power3.out' }
            );
          });
        }

        App.setupCardTilt();
      }

      render();
      document.addEventListener('madrasati:language-changed', render);
    });
  </script>
</body>
</html>
